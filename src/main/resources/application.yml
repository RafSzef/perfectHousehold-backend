server:
  port: ${APP_PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: perfecthousehold-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:perfecthousehold}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  flyway:
    enabled: true
    locations: classpath:db/migration
    sql-migration-prefix: "V"
    sql-migration-separator: "__"
    baseline-on-migrate: true
    validate-migration-naming: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.perfecthousehold.security.entity
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

security:
  jwt:
    # 256-bit hex secret key for HMAC-SHA256
    secret: ${JWT_SECRET:${SECURITY_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
    expiration-ms: ${JWT_EXPIRATION_MS:${SECURITY_JWT_EXPIRATION_MS:86400000}} # 24h

logging:
  level:
    root: INFO
    org.flywaydb: DEBUG
    com.perfecthousehold: DEBUG
